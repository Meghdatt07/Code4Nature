services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: climos
      POSTGRES_USER: climos
      POSTGRES_PASSWORD: climos
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://climos:climos@db:5432/climos
      SECRET_KEY: change-me
      DEMO_FX_USD_INR: 83
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
