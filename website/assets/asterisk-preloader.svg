<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#062419"/><stop offset=".55" stop-color="#04140e"/><stop offset="1" stop-color="#020c08"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#63d0d2" stop-opacity=".9"/><stop offset="1" stop-color="#0b4b46" stop-opacity=".62"/></linearGradient>
  <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8b5b30"/><stop offset="1" stop-color="#2c180d"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#4bbf62"/><stop offset=".55" stop-color="#b8ed6c"/><stop offset="1" stop-color="#e7ff8a"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#63e6d6"/><stop offset="1" stop-color="#61f29c"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#60f2c4" stop-opacity=".25"/><stop offset="1" stop-color="#60f2c4" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity=".4" filter="url(#blur)">
  <circle cx="120" cy="110" r="150" fill="#2c8d58"/><circle cx="1480" cy="130" r="180" fill="#1f7351"/>
  <circle cx="760" cy="840" r="240" fill="#1a7650"/><circle cx="310" cy="700" r="120" fill="#0d8b63"/>
  <circle cx="1320" cy="740" r="130" fill="#3d8b49"/>
</g>
<rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

<!-- left flooded cross-section -->
<rect x="0" y="330" width="800" height="260" fill="url(#water)"/>
<rect x="0" y="590" width="800" height="160" fill="#3b2716"/>
<g opacity=".55" stroke="#8fd8d0">
  <path d="M0 348 C180 338 320 364 520 344 S720 350 800 338" fill="none" stroke-width="5"/>
  <path d="M30 375 C160 360 260 386 390 370 S650 380 790 365" fill="none" stroke-width="2"/>
</g>
<!-- right dry cross-section -->
<rect x="800" y="520" width="800" height="230" fill="url(#soil)"/>
<rect x="800" y="748" width="800" height="2" fill="#d08a43" opacity=".45"/>

<!-- plants -->
<g filter="url(#shadow)">
  <path d="M405 585 C408 505 411 430 402 360" fill="none" stroke="#7d9d61" stroke-width="15" stroke-linecap="round"/>
  <path d="M1195 615 C1198 525 1191 445 1198 360" fill="none" stroke="#72934f" stroke-width="15" stroke-linecap="round"/>
  <g fill="url(#leaf)">
    <path d="M402 365 C280 306 250 210 292 92 C370 175 410 254 402 365Z"/>
    <path d="M402 386 C510 275 555 174 540 70 C465 135 426 225 402 386Z"/>
    <path d="M405 410 C300 350 212 334 118 330 C205 397 303 436 405 410Z"/>
    <path d="M410 448 C498 382 594 352 670 382 C598 445 508 465 410 448Z"/>
    <path d="M1195 365 C1100 286 1075 186 1102 88 C1170 180 1201 268 1195 365Z"/>
    <path d="M1195 390 C1290 270 1374 207 1450 180 C1407 290 1325 359 1195 390Z"/>
    <path d="M1197 425 C1092 362 1018 348 923 362 C997 432 1093 453 1197 425Z"/>
    <path d="M1200 452 C1298 402 1402 389 1494 423 C1397 477 1302 486 1200 452Z"/>
  </g>
</g>

<!-- roots -->
<g stroke="#e2c79e" fill="none" stroke-linecap="round">
  <path d="M402 575 C372 605 350 645 329 690 M402 580 C402 630 387 683 374 727 M406 575 C443 610 474 664 493 716 M399 584 C360 619 321 636 288 646" stroke-width="6"/>
  <path d="M1194 607 C1154 640 1133 685 1114 727 M1195 610 C1190 653 1182 702 1168 742 M1200 610 C1237 651 1272 694 1298 726 M1203 612 C1243 646 1290 665 1330 677" stroke-width="6"/>
</g>

<!-- methane bubbles -->
<g fill="#dffcff" fill-opacity=".08" stroke="#dffcff" stroke-opacity=".62">
 <circle cx="150" cy="455" r="28"/><circle cx="245" cy="520" r="39"/><circle cx="340" cy="438" r="25"/>
 <circle cx="500" cy="500" r="31"/><circle cx="610" cy="455" r="18"/><circle cx="285" cy="600" r="16"/>
 <circle cx="525" cy="565" r="14"/><circle cx="115" cy="575" r="11"/>
 <circle cx="1335" cy="620" r="22"/><circle cx="1420" cy="680" r="14"/><circle cx="1250" cy="670" r="11"/>
</g>
<g fill="#fff" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
 <text x="150" y="462" font-size="20">CH₄</text><text x="245" y="529" font-size="25">CH₄</text><text x="340" y="445" font-size="17">CH₄</text>
 <text x="500" y="507" font-size="20">CH₄</text><text x="610" y="461" font-size="13">CH₄</text><text x="1335" y="626" font-size="14">CH₄</text>
</g>

<!-- labels -->
<g font-family="Arial, sans-serif">
 <rect x="54" y="70" width="292" height="72" rx="18" fill="#07271e" fill-opacity=".82" stroke="#55d9bd" stroke-opacity=".35"/>
 <text x="82" y="101" fill="#f2fff8" font-size="22" font-weight="700">FLOODED FIELD</text>
 <text x="82" y="127" fill="#99c4b6" font-size="14" letter-spacing="2">CONTINUOUS SUBMERGENCE</text>
 <rect x="54" y="162" width="322" height="84" rx="18" fill="#061913" fill-opacity=".84"/>
 <text x="82" y="198" fill="#fff" font-size="23" font-weight="700">↑ HIGHER CH₄</text>
 <text x="82" y="223" fill="#a7c6b9" font-size="13">Anaerobic soil conditions increase</text>
 <text x="82" y="241" fill="#a7c6b9" font-size="13">methane emissions</text>

 <rect x="1250" y="70" width="296" height="72" rx="18" fill="#073622" fill-opacity=".84" stroke="#62e78f" stroke-opacity=".35"/>
 <text x="1278" y="101" fill="#f2fff8" font-size="22" font-weight="700">AWD / DRY-DOWN</text>
 <text x="1278" y="127" fill="#a3ceb3" font-size="14" letter-spacing="2">INTERMITTENT IRRIGATION</text>
 <rect x="1216" y="162" width="330" height="84" rx="18" fill="#061913" fill-opacity=".84"/>
 <text x="1244" y="198" fill="#fff" font-size="23" font-weight="700">↓ LOWER CH₄</text>
 <text x="1244" y="223" fill="#a7c6b9" font-size="13">Periodic drying reduces methane</text>
 <text x="1244" y="241" fill="#a7c6b9" font-size="13">emissions</text>
</g>

<!-- centered branding -->
<g font-family="Arial, sans-serif" text-anchor="middle">
 <text x="800" y="95" fill="#fff" font-size="13" letter-spacing="7">✦</text>
 <text x="800" y="132" fill="#eefcf5" font-size="20" letter-spacing="6">ASTERISK CLIMOS</text>
 <text x="800" y="156" fill="#81b8a4" font-size="12" letter-spacing="5">CODE4NATURE</text>
 <text x="800" y="628" fill="#e7f7ef" font-size="19" letter-spacing="8">WELCOME TO THE WORLD OF OPPORTUNITIES</text>
 <text x="800" y="700" fill="#fff" font-size="68" letter-spacing="4">ASTERISK <tspan fill="#62e6b0">CLIMOS</tspan></text>
 <text x="800" y="738" fill="#b0cfc2" font-size="13" letter-spacing="6">MEASURE · OPTIMIZE · REDUCE · CREATE VALUE</text>
</g>

<!-- loading line -->
<rect x="470" y="775" width="660" height="7" rx="4" fill="#1e5d48"/>
<rect x="470" y="775" width="0" height="7" rx="4" fill="url(#accent)">
 <animate attributeName="width" from="0" to="660" dur="4.2s" fill="freeze"/>
</rect>
<text x="800" y="805" fill="#91ad9f" font-family="Arial, sans-serif" font-size="11" letter-spacing="4" text-anchor="middle">LOADING CLIMATE INTELLIGENCE... 0 → 100%</text>

<!-- exactly one visible LET'S GO -->
<rect x="650" y="830" width="300" height="54" rx="27" fill="#071b13" fill-opacity=".8" stroke="#74f4c8" stroke-opacity=".9" stroke-width="2"/>
<text x="800" y="864" fill="#f4fff9" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4" text-anchor="middle">LET’S GO ↗</text>
</svg>